name: PureViewMedia
options:
  bundleIdPrefix: com.pureview
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  PureViewMedia:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pureview.media
        PRODUCT_NAME: PureViewMedia
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: PureViewMedia
        CFBundleDisplayName: "PureView 媒体浏览器"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "12.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSApplicationCategoryType: "public.app-category.photography"
        # 说明：非沙盒应用，可读取用户选择的任意目录、访问网络（Nominatim）。
